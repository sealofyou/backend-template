# pyproject.toml

[project]
name = "backend-template"
version = "0.1.0"

dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "pydantic-settings==2.11.0",
    "python-dotenv==1.1.1",
    "sqlalchemy>=2.0.46",
    "pymysql==1.1.2",
    "redis==4.6.0",
    "python-multipart==0.0.20",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
namespaces = false
